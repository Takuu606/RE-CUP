    <style>
        /* Giao diện Profile phong cách Sáng - Sang Trọng (Modern Glass) */
        body {
            background-color: #f4f4f6;
        }

        .profile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 20px 120px 20px;
            box-sizing: border-box;
        }

        .profile-card-bright {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            color: #111;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        .profile-avatar-circle {
            width: 85px;
            height: 85px;
            background: #000;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .profile-avatar-circle svg {
            stroke: white;
        }

        .profile-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            margin-bottom: 6px;
            letter-spacing: 2px;
            color: #000;
        }

        .profile-email {
            font-family: 'Source Code Pro', monospace;
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
            word-break: break-all;
        }

        .points-box-bright {
            background: #f0f0f3;
            border: 1px solid #e2e2e8;
            border-radius: 18px;
            padding: 18px 22px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .points-label {
            font-family: 'Source Code Pro', monospace;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        .points-value {
            font-family: 'Source Code Pro', monospace;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #000;
        }

        .r-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 22px;
            height: 22px;
            border: 2px solid #000;
            border-radius: 50%;
            font-size: 12px;
            font-style: italic;
            font-weight: bold;
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Source Code Pro', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .btn-logout:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .btn-logout:active {
            transform: scale(0.98);
        }
    </style>

    <!-- ================= JAVASCRIPT XỬ LÝ SUPABASE ================= -->
    <script>
        const SUPABASE_URL = 'https://eorsqenkghzwmfkktzad.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_28EaGfzRhxdSeCF17VEowg_acxaHuGB';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Kiểm tra phiên đăng nhập
        async function checkUserProfile() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();

            if (!session || !session.user) {
                // Nếu chưa đăng nhập, chuyển trực tiếp về trang chủ không thông báo
                window.location.href = 'index.html';
            } else {
                document.getElementById('userEmail').innerText = session.user.email;
            }
        }

        // Hàm xử lý Đăng xuất (Tắt thông báo alert)
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            // Đăng xuất xong chuyển về index.html ngay
            window.location.href = 'index.html';
        }
        // Hàm tự động kiểm tra trạng thái Đăng nhập và cập nhật Menu
        async function checkAuthAndRenderMenu() {
            if (typeof supabaseClient === 'undefined') return;

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const authText = document.getElementById('menuAuthText');
                const authIcon = document.getElementById('menuAuthIcon');

                if (session && session.user) {
                    // Đã đăng nhập: Đổi chữ thành "Profile" và đổi icon thành hình Avatar/User
                    if (authText) authText.innerText = 'Profile';
                    if (authIcon) {
                        authIcon.setAttribute('viewBox', '0 0 24 24');
                        authIcon.setAttribute('fill', 'none');
                        authIcon.setAttribute('stroke', 'currentColor');
                        authIcon.setAttribute('stroke-width', '1.5');
                        authIcon.innerHTML = `
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                `;
                    }
                } else {
                    // Chưa đăng nhập: Giữ nguyên Log in
                    if (authText) authText.innerText = 'Log in';
                    if (authIcon) {
                        authIcon.innerHTML = `
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                `;
                    }
                }
            } catch (err) {
                console.error("Lỗi kiểm tra auth:", err);
            }
        }

        // Xử lý khi bấm vào nút Menu trái
        async function handleAuthClick(e) {
            if (e) e.preventDefault();
            if (typeof supabaseClient === 'undefined') return;

            const { data: { session } } = await supabaseClient.auth.getSession();

            if (session && session.user) {
                window.location.href = 'profile.html';
            } else {
                if (typeof openLoginModal === 'function') {
                    openLoginModal();
                } else {
                    window.location.href = 'index.html';
                }
            }
        }

        // Chạy kiểm tra ngay khi tải xong trang và lắng nghe thay đổi
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndRenderMenu();
            if (typeof supabaseClient !== 'undefined') {
                supabaseClient.auth.onAuthStateChange(() => {
                    checkAuthAndRenderMenu();
                });
            }
        });

        checkUserProfile();
    </script>
