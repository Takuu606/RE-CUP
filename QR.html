<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mã QR - RE:CUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Source Code Pro', monospace;
        }

        .qr-full-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 40px 20px 100px 20px;
        }

        .qr-header-title {
            font-family: 'Cinzel', serif;
            color: white;
            font-size: 28px;
            letter-spacing: 3px;
            margin: 10px 0 20px 0;
            text-align: center;
        }

        .qr-tabs { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 20px; 
            z-index: 10;
        }

        .qr-tab-btn { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            color: #aaa; 
            padding: 10px 28px; 
            border-radius: 99px; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 14px; 
            font-weight: bold; 
            transition: 0.3s; 
            backdrop-filter: blur(5px);
        }

        .qr-tab-btn.active { 
            background: white; 
            color: black; 
            border-color: white; 
        }

        .qr-content-body {
            flex: 1;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #view-my-qr {
            text-align: center;
            width: 100%;
        }

        .my-qr-box {
            background: white;
            padding: 20px;
            border-radius: 24px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .my-qr-box img {
            width: 250px;
            height: 250px;
            display: block;
        }

        #view-scan-qr {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #reader { 
            width: 100% !important; 
            max-width: 380px;
            height: 380px !important;
            border-radius: 28px; 
            overflow: hidden; 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            background: #111; 
            position: relative;
        }

        #reader video { 
            object-fit: cover !important; 
            width: 100% !important; 
            height: 100% !important; 
        }
        .single-home-nav {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
}

.home-circle-btn {
    width: 56px;
    height: 56px;
    background-color: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
    transition: transform 0.2s ease;
}

.home-circle-btn:active {
    transform: scale(0.9);
}

.home-circle-btn svg {
    width: 26px;
    height: 26px;
    stroke: black;
    fill: none;
    stroke-width: 2.2;
}
    </style>
</head>
<body>

    <!-- CONTAINER QUÉT QR FULL MÀN HÌNH -->
    <div class="qr-full-wrapper">
        <h1 class="qr-header-title">RE:CUP</h1>
        
        <div class="qr-tabs">
            <button class="qr-tab-btn active" id="btn-my-qr" onclick="switchTab('my-qr')">Mã của tôi</button>
            <button class="qr-tab-btn" id="btn-scan-qr" onclick="switchTab('scan-qr')">Quét mã</button>
        </div>

        <div class="qr-content-body">
            <!-- VIEW 1: Mã QR của user -->
            <div id="view-my-qr">
                <div class="my-qr-box">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=RECUP-MEMBER-2026" alt="QR Code">
                </div>
                <div style="margin-top: 25px; color: white; display: flex; justify-content: center; align-items: center; gap: 15px;">
                    <span style="font-size: 15px; color: #aaa;">Thành viên</span>
                    <span style="font-weight: bold; font-size: 18px; display: inline-flex; align-items: center;">
                        <span style="background: white; color: black; display: inline-flex; justify-content: center; align-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 13px; font-weight: bold; margin-right: 6px;">R</span>1.000
                    </span>
                </div>
            </div>

            <!-- VIEW 2: Camera Quét mã -->
            <div id="view-scan-qr" style="display: none;">
                <div id="reader"></div>
                <p id="scan-status" style="font-size: 14px; color: #aaa; margin-top: 15px; text-align: center;">Đang khởi động Camera...</p>
            </div>
        </div>
    </div>

    <div class="single-home-nav">
        <div class="home-circle-btn" onclick="window.location.href='index.html'" title="Về trang chủ">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION CHUẨN ĐỒNG BỘ -->
    <div class="single-home-nav">
        <div class="home-circle-btn" onclick="window.location.href='index.html'" title="Về trang chủ">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        </div>
    </div>
    <!-- POPUP CÂY XANH -->
    <div id="successPopup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(8px);" onclick="closeSuccessPopup()">
        <div style="background: linear-gradient(145deg, #2a2a2a, #181818); padding: 40px 25px; border-radius: 24px; text-align: center; max-width: 360px; width: 85%; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid #333;" onclick="event.stopPropagation()">
            <div style="background: #e6e6e6; width: 110px; height: 110px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 25px auto;">
                <svg width="60" height="60" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="35" stroke="#9bc554" stroke-width="4"></circle>
                    <line x1="50" y1="85" x2="50" y2="25" stroke="#9bc554" stroke-width="4" stroke-linecap="round"></line>
                    <line x1="50" y1="65" x2="65" y2="40" stroke="#9bc554" stroke-width="4" stroke-linecap="round"></line>
                    <line x1="50" y1="45" x2="35" y2="25" stroke="#9bc554" stroke-width="4" stroke-linecap="round"></line>
                </svg>
            </div>
            <p style="color: white; font-size: 14px; line-height: 1.8; margin: 0; font-weight: 500;">
                “Bạn vừa thành công giúp giảm thiểu 1 chiếc cốc nhựa. Hành động nhỏ kết quả lớn.”
            </p>
        </div>
    </div>

<script>
    let html5QrCode;

    function switchTab(tabName) {
        document.getElementById('btn-my-qr').classList.remove('active');
        document.getElementById('btn-scan-qr').classList.remove('active');
        document.getElementById('btn-' + tabName).classList.add('active');

        if (tabName === 'my-qr') {
            document.getElementById('view-my-qr').style.display = 'block';
            document.getElementById('view-scan-qr').style.display = 'none';
            stopCamera();
        } else {
            document.getElementById('view-my-qr').style.display = 'none';
            document.getElementById('view-scan-qr').style.display = 'flex';
            startCamera();
        }
    }

    function startCamera() {
        const statusText = document.getElementById('scan-status');
        statusText.innerText = "Đang mở Camera...";
        
        if (!html5QrCode) { 
            html5QrCode = new Html5Qrcode("reader"); 
        }

        const scanConfig = { fps: 10, qrbox: { width: 260, height: 260 } };

        const onSuccess = (decodedText, decodedResult) => {
            document.getElementById('successPopup').style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate(200);
            switchTab('my-qr');
        };

        const onError = (errorMessage) => { };

        html5QrCode.start({ facingMode: "environment" }, scanConfig, onSuccess, onError)
        .then(() => {
            statusText.innerText = "Đưa mã QR bất kỳ vào khung hình";
        })
        .catch((err) => {
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    html5QrCode.start(devices[0].id, scanConfig, onSuccess, onError)
                    .then(() => { statusText.innerText = "Đưa mã QR bất kỳ vào khung hình"; })
                    .catch(e => { 
                        statusText.innerText = "Lỗi: Trình duyệt đang chặn Camera!"; 
                        statusText.style.color = "#e74c3c"; 
                    });
                } else {
                    statusText.innerText = "Không tìm thấy Camera!";
                    statusText.style.color = "#e74c3c";
                }
            }).catch(e => {
                statusText.innerText = "Bạn chưa cấp quyền Camera!";
                statusText.style.color = "#e74c3c";
            });
        });
    }

    function stopCamera() {
        if (html5QrCode) {
            try {
                html5QrCode.stop().catch(err => {});
            } catch (e) {}
        }
    }

    function closeSuccessPopup() {
        document.getElementById('successPopup').style.display = 'none';
    }
</script>
</body>
</html>
