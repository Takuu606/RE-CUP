<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ---------------- CAMERA LOGIC (FIX LẤY NÉT ĐIỆN THOẠI) ----------------
    let html5QrCode;

    function switchTab(tabName) {
        document.getElementById('btn-my-qr').classList.remove('active');
        document.getElementById('btn-scan-qr').classList.remove('active');
        document.getElementById('btn-' + tabName).classList.add('active');

        if (tabName === 'my-qr') {
            document.getElementById('view-my-qr').style.display = 'block';
            document.getElementById('view-scan-qr').style.display = 'none';
            stopCamera();
        } else {
            document.getElementById('view-my-qr').style.display = 'none';
            document.getElementById('view-scan-qr').style.display = 'block';
            startCamera();
        }
    }

    function startCamera() {
        const statusText = document.getElementById('scan-status');
        statusText.innerText = "Đang xin quyền Camera...";
        
        if (!html5QrCode) { 
            html5QrCode = new Html5Qrcode("reader"); 
        }

        // Thêm lại khung ngắm qrbox để ép camera điện thoại lấy nét chuẩn vào giữa, không quét tràn lan gây mờ
        const scanConfig = { fps: 10, qrbox: { width: 250, height: 250 } };

        const onSuccess = (decodedText, decodedResult) => {
            statusText.innerText = "Quét thành công!";
            statusText.style.color = "#2ecc71";
            stopCamera();
            switchTab('my-qr');
            document.getElementById('successPopup').style.display = 'flex';
        };

        const onError = (errorMessage) => { /* bỏ qua lỗi mờ khung hình khi đang dò */ };

        // 1. Ưu tiên gọi chuẩn Camera chính (mặt sau) của điện thoại
        html5QrCode.start({ facingMode: "environment" }, scanConfig, onSuccess, onError)
        .then(() => {
            statusText.innerText = "Đưa mã QR bất kỳ vào khung hình";
        })
        .catch((err) => {
            // 2. Nếu thất bại (Do mở trên Laptop), tự động tìm Webcam
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    html5QrCode.start(devices[0].id, scanConfig, onSuccess, onError)
                    .then(() => { statusText.innerText = "Đưa mã QR bất kỳ vào khung hình"; })
                    .catch(e => { 
                        statusText.innerText = "Lỗi: Trình duyệt đang chặn Camera!"; 
                        statusText.style.color = "#e74c3c"; 
                    });
                } else {
                    statusText.innerText = "Không tìm thấy Camera trên máy!";
                    statusText.style.color = "#e74c3c";
                }
            }).catch(e => {
                statusText.innerText = "Bạn chưa cấp quyền Camera!";
                statusText.style.color = "#e74c3c";
            });
        });
    }

    function stopCamera() {
        if (html5QrCode) {
            html5QrCode.stop().then(ignore => {}).catch(err => console.log(err));
        }
    }

    function closeSuccessPopup() {
        document.getElementById('successPopup').style.display = 'none';
    }

    // ---------------- SEARCH & SUPABASE LOGIC ----------------
    const SUPABASE_URL = 'https://eorsqenkghzwmfkktzad.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_28EaGfzRhxdSeCF17VEowg_acxaHuGB'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let globalPosts = []; 
    async function loadDataForSearch() {
        const { data, error } = await supabaseClient.from('trangchu-index').select('*');
        if (!error && data) { globalPosts = data; }
    }
    loadDataForSearch();

    function openSearch() { document.getElementById('searchModal').classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeSearch(event) { if (event.target.id === 'searchModal') { document.getElementById('searchModal').classList.remove('active'); document.body.style.overflow = ''; } }
    function selectFilter(clickedElement) { document.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active')); clickedElement.classList.add('active'); }

    function triggerSearch() {
        let keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        let activeTags = Array.from(document.querySelectorAll('.search-pill')).map(pill => pill.dataset.name.toLowerCase());
        
        let sheet = document.querySelector('.search-sheet');
        let suggestionsContainer = document.querySelector('.search-suggestions');

        if (keyword.length > 0 || activeTags.length > 0) {
            sheet.classList.add('expanded');
            let matchedPosts = globalPosts.filter(post => {
                let name = (post.shop_name || '').toLowerCase();
                let content = (post.content || '').toLowerCase();
                let hashtags = (post.hashtags || '').toLowerCase();
                
                let matchKeyword = keyword === "" || name.includes(keyword) || content.includes(keyword) || hashtags.includes(keyword);
                let matchTags = activeTags.every(tag => name.includes(tag) || content.includes(tag) || hashtags.includes(tag));
                return matchKeyword && matchTags;
            });

            let html = `<p class="suggestion-title" style="margin-bottom: 10px; font-size: 11px; color: #888; font-weight: bold;">ĐỀ XUẤT TÌM KIẾM</p>`;
            if (matchedPosts.length > 0) {
                matchedPosts.forEach(post => {
                    html += `
                        <div class="suggestion-item" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer;">
                            <img src="${post.avatar_url}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                            <div style="flex: 1;">
                                <p style="font-weight: bold; font-size: 14px; margin: 0; color: #000;">${post.shop_name}</p>
                                <p style="font-size: 12px; color: #666; margin: 2px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;">${post.content}</p>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `<p style="font-size: 13px; color: #888; padding: 10px 0;">Không tìm thấy kết quả phù hợp</p>`;
            }
            suggestionsContainer.innerHTML = html;
        } else {
            sheet.classList.remove('expanded');
            suggestionsContainer.innerHTML = `<p class="suggestion-title">ĐỀ XUẤT TÌM KIẾM</p>`;
        }
    }

    function showSuggestions(inputField) { triggerSearch(); }

    function selectSearchTag(element) {
        let tagName = element.innerText.trim();
        let container = document.getElementById('tagPillsContainer');
        let existing = container.querySelectorAll('.search-pill');
        if (!Array.from(existing).some(tag => tag.dataset.name === tagName)) {
            let pill = document.createElement('span');
            pill.className = 'search-pill';
            pill.dataset.name = tagName;
            pill.style.cssText = "background: white; color: black; padding: 3px 10px; border-radius: 99px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500;";
            pill.innerHTML = `${tagName} <span onclick="removeSearchTag(this)" style="cursor: pointer; font-weight: bold; font-size: 14px; line-height: 1; opacity: 0.6;">&times;</span>`;
            container.appendChild(pill);
        }
        document.getElementById('searchInput').focus();
        triggerSearch(); 
    }

    function removeSearchTag(closeBtn) {
        closeBtn.parentElement.remove();
        document.getElementById('searchInput').focus();
        triggerSearch(); 
    }
</script>
