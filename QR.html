<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét Mã QR - RE:CUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css"> <!-- Kế thừa CSS gốc của bạn -->
    <style>
        /* ================= CÀI ĐẶT CƠ BẢN CHO TRANG QUÉT QR ================= */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Source Code Pro', monospace;
            overflow: hidden; /* Ngăn chặn cuộn trang */
            color: white;
        }

        /* Ghi đè CSS từ index.css để vô hiệu hóa nền trắng */
        .container {
            background-color: transparent;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            display: block; /* Vô hiệu hóa Flexbox cũ để không ảnh hưởng layout camera */
        }

        /* Menu điều hướng bên trái (Máy tính) - Chỉnh màu chữ thành trắng để nổi trên nền đen */
        .nav-right {
            background-color: rgba(0, 0, 0, 0.5); /* Nền đen trong suốt */
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-right:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .menu-icon a, .menu-icon.menu2 {
            color: white;
        }

        .menu-icon svg {
            fill: white;
        }

        .menu-icon:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* ================= KHUNG CHỨA CAMERA ================= */
        .camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Nền hiển thị trước khi camera bật (hoặc giả lập luồng video) */
            background-color: #1a1a1a; 
            background-image: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 1;
        }

        /* ================= LỚP PHỦ TỐI & KHUNG NGẮM ================= */
        .qr-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Tránh cản trở sự kiện nhấp chuột */
        }

        /* Khung ngắm đục lỗ (Square Hole) */
        .scan-box {
            position: relative;
            width: 280px;
            height: 280px;
            /* Đổ bóng đen siêu lớn để tạo lớp phủ tối xung quanh lỗ hổng */
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.65);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Tạo 4 góc bo viền hình chữ "L" */
        .scan-box::before, .scan-box::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 4px solid transparent;
            border-radius: 16px;
        }
        
        .scan-box::before {
            border-top-color: #a0c860; /* Xanh lá */
            border-left-color: #a0c860;
            width: 50px;
            height: 50px;
            top: 0;
            left: 0;
        }

        .scan-box::after {
            border-bottom-color: #a0c860;
            border-right-color: #a0c860;
            width: 50px;
            height: 50px;
            bottom: 0;
            right: 0;
        }

        /* ================= TIA LASER QUÉT ================= */
        .laser-line {
            position: absolute;
            top: 0;
            left: 2%;
            width: 96%;
            height: 3px;
            background-color: #a0c860;
            border-radius: 2px;
            box-shadow: 0 0 15px 4px rgba(160, 200, 96, 0.6);
            animation: scanLaser 2.5s ease-in-out infinite;
        }

        @keyframes scanLaser {
            0% { top: 2%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 96%; opacity: 0; }
        }

        /* ================= TIÊU ĐỀ & VĂN BẢN ================= */
        .header-title {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .header-title h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 3px;
            font-family: 'Cinzel', serif; /* Dùng font logo */
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .instruction-text {
            position: absolute;
            bottom: 150px; /* Nâng cao lên để nhường chỗ cho Menu đáy */
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .instruction-text p {
            margin: 0;
            font-size: 15px;
            color: #e0e0e0;
            line-height: 1.6;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(5px);
        }

        /* ================= NÚT ĐÓNG (QUAY LẠI) ================= */
        .btn-back {
            position: absolute;
            top: 45px;
            left: 100px; /* Dịch qua phải để né menu bên trái (Máy tính) */
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            transition: background 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Tùy chỉnh Menu đáy (Mobile) sao cho nổi trên nền đen */
        @media (max-width: 1348px) {
            .btn-back {
                left: 20px; /* Khôi phục vị trí bên trái cho màn hình nhỏ */
            }
            .mobile-bottom-nav {
                display: flex; 
                position: fixed; 
                bottom: 30px; 
                left: 50%;
                transform: translateX(-50%);
                align-items: center; gap: 10px; z-index: 1000;
            }
            /* Thiết kế lại màu cho menu ngang nổi trên nền Camera */
            .nav-circle { 
                background-color: white; 
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            }
            .nav-pill { 
                background-color: white; 
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            }
            /* Đổi biểu tượng màu đen để tương phản với nền trắng của nút */
            .nav-pill svg { 
                stroke: black; 
            }
        }
    </style>
</head>
